<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CART</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>Top-Mart</header>
    <p id="info">Your one way stop to affordable Tops</p>

    <div id="productsContainer">
      <div class="product">
        <img src="images/hoodie.png" />
        <p class="details">
          <span class="name">Black Hoodie </span><span class="price">$30</span>
        </p>
        <button class="add">+</button>
      </div>

      <div class="product">
        <img src="images/green-khaki.png" />
        <p class="details">
          <span class="name">Green Khaki</span><span class="price">$45</span>
        </p>

        <button class="add">+</button>
      </div>
      <div class="product">
        <img src="images/jeans-top.png" />
        <p class="details">
          <span class="name">Jeans Top</span><span class="price">$35</span>
        </p>

        <button class="add">+</button>
      </div>
    </div>
    <p id="cartH">Cart</p>
    <div id="cartItems">
      <ul id="ul"></ul>
    </div>
    <script src="main.js"></script>
  </body>
</html>
